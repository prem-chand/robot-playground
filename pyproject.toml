[project]
name = "robot-pg"
version = "0.1.0"
description = "Robot experiments in simulation, with controllers as blocks and runs that replay bitwise."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco==3.10.0",
    "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy",
    "scipy",
    "threadpoolctl",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "pyright",
    "control>=0.10.2",
]
viz = ["matplotlib", "imageio", "imageio-ffmpeg"]
rl = [
    "gymnasium>=0.29",
    "torch>=2.1",
    "torch<2.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.scripts]
robot-pg = "robot_pg.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["docs/plan-evidence"]

[tool.pyright]
include = ["src", "tests", "scripts"]
# The rl extra is optional. Without it, torch and gymnasium are unknown types
# in robot_pg.rl, and the rest of the package stays fully checked.
executionEnvironments = [
    { root = "src/robot_pg/rl", reportMissingImports = "none" },
    { root = "." },
]
